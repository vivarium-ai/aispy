[package]
name = "aispy"
version = "0.1.0"
edition = "2024"
description = "Rust-native performance instrumentation and analysis for heterogeneous CPU/GPU workloads"
license = "MIT"
repository = "https://github.com/vivarium-ai/aispy"
readme = "README.md"
publish = false

[workspace]
resolver = "3"
members = [
    "crates/aispy-ebpf-common",
    "crates/aispy-macros",
    "crates/aispy-observe",
]
exclude = [
    "ebpf",
]

[lib]
name = "aispy"
path = "src/lib.rs"

[[bin]]
name = "aispy"
path = "src/bin/aispy/main.rs"
required-features = ["cli"]

[features]
default = []

# Builds the aispy command-line frontend.
cli = [
    "dep:blake3",
    "dep:clap",
    "dep:duckdb",
    "dep:serde_json",
    "dep:toml",
]

# In-process CUDA/CUPTI integration used by instrumented workloads.
cuda = [
    "dep:libloading",
]

[dependencies]
aispy-ebpf-common = { path = "crates/aispy-ebpf-common", version = "0.1.0" }
aispy-macros = { path = "crates/aispy-macros", version = "0.1.0" }

# Core library.
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

# Collection and storage.
anyhow = "1"
arrow = "59"
blake3 = { version = "1", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
duckdb = { version = "1", optional = true }
parquet = { version = "59", features = ["arrow"] }
serde_json = { version = "1", optional = true }
toml = { version = "1", optional = true }

# Optional CUDA/CUPTI support.
libloading = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
nvml-wrapper = "0.13"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

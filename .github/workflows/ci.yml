name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-workspace:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make setup-dev
      - run: make verify-workspace

  library:
    name: Build support library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make setup-dev
      - run: make build-library

  cuda:
    name: Build CUDA instrumentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make setup-dev
      - run: make build-cuda

  cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make setup-dev
      - run: make build-cli

  ebpf:
    name: Build eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: make setup-dev
      - run: make setup-ebpf
      - run: make build-ebpf

  docker:
    name: Docker
    needs:
      - library
      - cli
      - cuda
      - ebpf

    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      contains(github.ref_name, '.')

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker.yml

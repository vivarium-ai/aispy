[package]
name = "aispy-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for AiSpy semantic instrumentation"
license = "MIT"
repository = "https://github.com/vivarium-ai/aispy"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
